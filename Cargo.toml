[package]
name = "spotifyAudioD"
version = "0.1.0"
edition = "2024"

[dependencies]
librespot = { version = "0.8.0", default-features = false, features = ["native-tls"] }
tokio = { version = "1.53.1", features = ["full"] }
env_logger = "0.11.11"
dirs = "7.0.0"
axum = "0.8.9"
oauth2 = { version = "5.0", default-features = false, features = ["reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
bytes = "1.12.1"
uuid = { version = "1.26.1", features = ["v4"] }

[build-dependencies]
vergen = "=9.0.6"